image:
  repository: muniu-kind
  tag: ci
  pullPolicy: Never

host:
  replicas: 2

worker:
  enabled: true
  replicas: 2
  leaseMs: 30000
  fixtureMode: true
  supportedKinds:
    - system.noop
    - agent.execution.run
    - fixture.echo
    - fixture.wait
    - fixture.external_unknown

autoscaling:
  host: { enabled: false }
  worker: { enabled: false }

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: muniu-kind
  kubernetesApiEgress:
    - ipBlock: { cidr: 10.96.0.1/32 }
    - ipBlock: { cidr: 172.18.0.2/32 }
  kubernetesApiPorts: [443, 6443]
  runtimeEgress:
    - to:
        - podSelector:
            matchLabels: { muniu.ai/runtime-dependency: "true" }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9000 }
        - { protocol: TCP, port: 8080 }

postgres:
  existingSecret: muniu-postgres-v2

eventIntegrity:
  existingSecret: muniu-event-integrity-v2

s3:
  endpoint: http://muniu-kind-minio:9000
  bucket: muniu-kind-v2
  region: us-east-1
  prefix: v2/kind-failover/
  existingSecret: muniu-s3-v2

oidc:
  issuer: http://muniu-kind-fixture:8080
  audience: muniu-kind-v2
  jwksUrl: http://muniu-kind-fixture:8080/jwks.json

sandbox:
  driver: kubernetes
  image: localhost:5001/muniu-kind:ci
  imageDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  runtimeClassName: muniu-sandbox
  sharedWorkspace:
    create: false
    existingClaim: muniu-kind-sandboxes
    mountPath: /work/sandboxes
