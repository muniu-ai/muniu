{{- if ne .Values.sandbox.driver "kubernetes" }}{{- fail "the Kubernetes chart requires sandbox.driver=kubernetes" }}{{- end }}
{{- if not (regexMatch "^[a-f0-9]{64}$" .Values.sandbox.imageDigest) }}{{- fail "sandbox.imageDigest must be 64 lowercase hexadecimal characters" }}{{- end }}
{{- if and (not .Values.sandbox.sharedWorkspace.create) (not .Values.sandbox.sharedWorkspace.existingClaim) }}{{- fail "sandbox.sharedWorkspace.existingClaim is required when create=false" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muniu.fullname" . }}
  labels: {{- include "muniu.labels" . | nindent 4 }}
data:
  MN_RUNTIME_PROFILE: enterprise
  MN_API_HOST: {{ .Values.api.host | quote }}
  MN_API_PORT: {{ .Values.api.port | quote }}
  MN_CORS_ALLOWLIST: {{ required "corsAllowlist is required" (join "," .Values.corsAllowlist) | quote }}
  MN_ENTERPRISE_PROJECT_ROOTS: {{ join "," .Values.enterpriseProjectRoots | quote }}
  MN_OIDC_ISSUER: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
  MN_OIDC_AUDIENCE: {{ required "oidc.audience is required" .Values.oidc.audience | quote }}
  MN_OIDC_JWKS_URL: {{ required "oidc.jwksUrl is required" .Values.oidc.jwksUrl | quote }}
  MN_OTEL_EXPORTER_OTLP_ENDPOINT: {{ required "otlp.endpoint is required" .Values.otlp.endpoint | quote }}
  MN_OTEL_SERVICE_NAME: {{ .Values.otlp.serviceName | quote }}
  MN_ARTIFACT_REMOTE_STORE_TYPE: s3
  MN_ARTIFACT_REMOTE_STORE_ENDPOINT_URL: {{ required "s3.endpointUrl is required" .Values.s3.endpointUrl | quote }}
  MN_ARTIFACT_REMOTE_STORE_BUCKET: {{ required "s3.bucket is required" .Values.s3.bucket | quote }}
  MN_ARTIFACT_OBJECT_STORE_LOCAL_BACKEND_PATH: /tmp/muniu-artifact-mirror
  MN_ARTIFACT_S3_REGION: {{ .Values.s3.region | quote }}
  MN_ARTIFACT_REMOTE_STORE_PREFIX: {{ .Values.s3.prefix | quote }}
  MN_AGENT_SESSION_KMS_KEY_ID: {{ .Values.s3.kmsKeyId | quote }}
  MN_STANDARD_PACK_TRUST_FILE: /etc/muniu/trust/trust.json
  MN_ENTERPRISE_SANDBOX_IMAGE: {{ .Values.sandbox.image | quote }}
  MN_ENTERPRISE_SANDBOX_IMAGE_DIGEST: {{ required "sandbox.imageDigest is required" .Values.sandbox.imageDigest | quote }}
  MN_SANDBOX_RUNTIME_DRIVER: {{ .Values.sandbox.driver | quote }}
  MN_KUBERNETES_NAMESPACE: {{ .Release.Namespace | quote }}
  MN_KUBERNETES_SHARED_VOLUME_CLAIM: {{ include "muniu.sharedWorkspaceClaimName" . | quote }}
  MN_KUBERNETES_SHARED_ROOT: {{ .Values.sandbox.sharedWorkspace.mountPath | quote }}
  MN_KUBERNETES_CANDIDATE_SERVICE_ACCOUNT: {{ include "muniu.candidateServiceAccountName" . | quote }}
  MN_KUBERNETES_RUNTIME_CLASS: {{ required "sandbox.runtimeClassName is required" .Values.sandbox.runtimeClassName | quote }}
