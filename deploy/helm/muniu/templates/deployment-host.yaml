apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muniu.fullname" . }}-host
  labels: {{- include "muniu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.host.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: host }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: host }
      annotations: {{- toYaml .Values.vault.annotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "muniu.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: host
          image: {{ include "muniu.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scripts/enterprise-host.mjs"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.host.port }} }]
          envFrom: [{ configMapRef: { name: {{ include "muniu.fullname" . }} } }]
          env:
            - name: MN_HOST_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.urlKey }} } }
            - name: MN_EVENT_HMAC_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.eventIntegrity.existingSecret }}, key: {{ .Values.eventIntegrity.hmacKey }} } }
            - name: MN_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.accessKeyIdKey }} } }
            - name: MN_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.secretAccessKeyKey }} } }
            {{- if .Values.s3.sessionTokenKey }}
            - name: MN_S3_SESSION_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.sessionTokenKey }}, optional: true } }
            {{- end }}
            {{- if .Values.vault.existingSecret }}
            - name: MN_VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.vault.existingSecret }}, key: {{ .Values.vault.tokenKey }} } }
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          readinessProbe:
            httpGet: { path: /v2/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /v2/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.host.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
