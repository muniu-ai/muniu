{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muniu.fullname" . }}-worker
  labels: {{- include "muniu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
    spec:
      serviceAccountName: {{ include "muniu.workerServiceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 35
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "muniu.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scripts/enterprise-worker.mjs"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom: [{ configMapRef: { name: {{ include "muniu.fullname" . }} } }]
          env:
            - name: MN_WORKER_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.urlKey }} } }
            - name: MN_EVENT_HMAC_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.eventIntegrity.existingSecret }}, key: {{ .Values.eventIntegrity.hmacKey }} } }
            - name: MN_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.accessKeyIdKey }} } }
            - name: MN_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.secretAccessKeyKey }} } }
            {{- if .Values.s3.sessionTokenKey }}
            - name: MN_S3_SESSION_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.sessionTokenKey }}, optional: true } }
            {{- end }}
            {{- if .Values.vault.existingSecret }}
            - name: MN_VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.vault.existingSecret }}, key: {{ .Values.vault.tokenKey }} } }
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - const s=require('node:fs').statSync('/tmp/mn-worker-ready');process.exit(Date.now()-s.mtimeMs<5000?0:1)
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - const s=require('node:fs').statSync('/tmp/mn-worker-ready');process.exit(Date.now()-s.mtimeMs<15000?0:1)
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "muniu.businessMounts" . | nindent 12 }}
            - { name: sandbox-workspaces, mountPath: {{ .Values.sandbox.sharedWorkspace.mountPath | quote }} }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- include "muniu.businessVolumes" . | nindent 8 }}
        - name: sandbox-workspaces
          persistentVolumeClaim: { claimName: {{ include "muniu.sharedWorkspaceClaimName" . }} }
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
{{- end }}
