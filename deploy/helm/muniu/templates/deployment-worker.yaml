{{- if .Values.worker.enabled }}
{{- if ne .Values.sandbox.driver "kubernetes" }}{{- fail "worker.enabled requires sandbox.driver=kubernetes" }}{{- end }}
{{- if not .Values.sandbox.runtimeClassName }}{{- fail "worker.enabled requires sandbox.runtimeClassName" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muniu.fullname" . }}-worker
  labels: {{- include "muniu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
    spec:
      serviceAccountName: {{ include "muniu.workerServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "muniu.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - apps/cli/dist/index.js
            - run
            - worker
            - --enterprise
            - --sandbox-driver
            - kubernetes
{{- if .Values.worker.fixtureMode }}
            - --mock
{{- end }}
            - --capacity
            - {{ .Values.worker.capacity | quote }}
            - --ttl-ms
            - {{ .Values.worker.claimTtlMs | quote }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: MN_API_URL, value: "http://{{ include "muniu.fullname" . }}:{{ .Values.service.port }}" }
            - name: MN_API_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.worker.authExistingSecret }}, key: {{ .Values.worker.authTokenKey }} } }
            - { name: MN_WORKER_PROVIDERS, value: "builtin" }
            - { name: MN_WORKER_TOOLS, value: {{ required "worker.tools is required" (join "," .Values.worker.tools) | quote }} }
            - { name: MN_ENTERPRISE_SANDBOX_IMAGE, value: {{ .Values.sandbox.image | quote }} }
            - { name: MN_WORKER_SANDBOX_DRIVER, value: kubernetes }
            - { name: MN_KUBERNETES_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: MN_KUBERNETES_SHARED_VOLUME_CLAIM, value: {{ include "muniu.sharedWorkspaceClaimName" . | quote }} }
            - { name: MN_KUBERNETES_SHARED_ROOT, value: {{ .Values.sandbox.sharedWorkspace.mountPath | quote }} }
            - { name: MN_KUBERNETES_CANDIDATE_SERVICE_ACCOUNT, value: {{ include "muniu.candidateServiceAccountName" . | quote }} }
            - { name: MN_KUBERNETES_RUNTIME_CLASS, value: {{ required "sandbox.runtimeClassName is required" .Values.sandbox.runtimeClassName | quote }} }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: sandbox-workspaces, mountPath: {{ .Values.sandbox.sharedWorkspace.mountPath | quote }} }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: sandbox-workspaces
          persistentVolumeClaim: { claimName: {{ include "muniu.sharedWorkspaceClaimName" . }} }
{{- end }}
