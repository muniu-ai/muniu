{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "muniu.fullname" . }}-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "muniu.fullname" . }}-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
{{ toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "muniu.fullname" . }}-host-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: host
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
{{ toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ .Values.host.port }} }
{{- if not .Values.networkPolicy.runtimeEgress }}{{- fail "networkPolicy.runtimeEgress is required" }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "muniu.fullname" . }}-runtime-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
{{ toYaml .Values.networkPolicy.runtimeEgress | nindent 4 }}
{{- if .Values.worker.enabled }}
{{- if not .Values.networkPolicy.kubernetesApiEgress }}{{- fail "networkPolicy.kubernetesApiEgress is required" }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "muniu.fullname" . }}-worker-kubernetes-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.kubernetesApiEgress | nindent 8 }}
      ports:
{{- range .Values.networkPolicy.kubernetesApiPorts }}
        - { protocol: TCP, port: {{ . }} }
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "muniu.fullname" . }}-sandbox-default-deny
spec:
  podSelector:
    matchLabels:
      muniu.ai/component: candidate-sandbox
  policyTypes: [Ingress, Egress]
{{- end }}
