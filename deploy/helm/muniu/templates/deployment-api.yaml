apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muniu.fullname" . }}-api
  labels: {{- include "muniu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
      annotations: {{- toYaml .Values.vault.annotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "muniu.serviceAccountName" . }}
      automountServiceAccountToken: {{ eq .Values.sandbox.driver "kubernetes" }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "muniu.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["apps/api/dist/index.js"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          envFrom: [{ configMapRef: { name: {{ include "muniu.fullname" . }} } }]
          env:
            - name: MN_API_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.urlKey }} } }
            - name: MN_ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.accessKeyIdKey }} } }
            - name: MN_ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.secretAccessKeyKey }} } }
            - name: MN_SANDBOX_ATTESTATION_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.sandbox.attestationExistingSecret }}, key: {{ .Values.sandbox.attestationKey }} } }
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: state, mountPath: /opt/muniu/.muniu }
            - { name: trust, mountPath: /etc/muniu/trust, readOnly: true }
            - { name: sandbox-workspaces, mountPath: {{ .Values.sandbox.sharedWorkspace.mountPath | quote }} }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: state, emptyDir: {} }
        - name: trust
          secret:
            secretName: {{ .Values.standardPackTrust.existingSecret }}
            items: [{ key: {{ .Values.standardPackTrust.key }}, path: trust.json }]
        - name: sandbox-workspaces
          persistentVolumeClaim: { claimName: {{ include "muniu.sharedWorkspaceClaimName" . }} }
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
