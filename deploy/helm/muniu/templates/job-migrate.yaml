apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "muniu.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "muniu.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "muniu.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "muniu.image" . }}
          args: ["apps/api/dist/migrate.js"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: MN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.urlKey }} } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
