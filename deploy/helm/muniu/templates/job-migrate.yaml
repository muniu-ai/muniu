{{- if not (has .Values.migration.appServerV3Mode (list "dry-run" "apply" "rollback")) }}{{- fail "migration.appServerV3Mode must be dry-run, apply or rollback" }}{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "muniu.fullname" . }}-migrate
  labels: {{- include "muniu.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "muniu.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "muniu.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "muniu.fullname" . }}-migrate
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        - name: migrate-control-state
          image: {{ include "muniu.image" . }}
          args: ["apps/api/dist/migrate.js"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: MN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.urlKey }} } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: migrate-app-server-v3
          image: {{ include "muniu.image" . }}
          args: ["apps/api/dist/migrateAppServerV3.js"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom: [{ configMapRef: { name: {{ include "muniu.fullname" . }} } }]
          env:
            - { name: MN_APP_SERVER_V3_MIGRATION_MODE, value: {{ .Values.migration.appServerV3Mode | quote }} }
            - name: MN_POSTGRES_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.urlKey }} } }
            - name: MN_ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.accessKeyIdKey }} } }
            - name: MN_ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: {{ .Values.s3.secretAccessKeyKey }} } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
