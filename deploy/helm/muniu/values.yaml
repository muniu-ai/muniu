image:
  repository: ghcr.io/muniu-ai/muniu
  tag: 0.2.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

host:
  replicas: 2
  bind: 0.0.0.0
  port: 7318
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

worker:
  enabled: true
  replicas: 2
  leaseMs: 30000
  fixtureMode: false
  handlerModule: /opt/muniu/scripts/enterprise-worker-handlers.mjs
  supportedKinds:
    - system.noop
    - agent.execution.run
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

runtimeLocks:
  engineDigest: 154c96a544775b9ef837aebc67909886a33f41f6f01537b24337049464f6265f
  pluginDigest: 14dc9ad11d121d0362398acb6579582157f079c06067eb09e10d22d35a11bb78

# 可选的镜像内第三方插件仓库。入口模块必须与索引同目录，且先验签再执行。
pluginRepository:
  enabled: false
  indexFile: ""
  trustedRootsFile: ""
  digest: ""

retention:
  businessDays: 365
  executionDays: 90
  deliverableDays: 365
  auditDays: 730

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: muniu.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  host:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  runtimeEgress: []
  kubernetesApiEgress: []
  kubernetesApiPorts: [443]

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

postgres:
  schema: mn_v2
  existingSecret: muniu-postgres-v2
  urlKey: url
  poolSize: 10

eventIntegrity:
  existingSecret: muniu-event-integrity-v2
  hmacKey: hmac-key

s3:
  endpoint: ""
  bucket: ""
  region: us-east-1
  prefix: v2/
  existingSecret: muniu-s3-v2
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key
  sessionTokenKey: session-token

oidc:
  issuer: ""
  audience: muniu-v2
  jwksUrl: ""

vault:
  address: ""
  kvMount: secret
  transitMount: transit
  transitKey: muniu-v2-protected-payloads
  namespace: ""
  existingSecret: ""
  tokenKey: token
  annotations: {}

telemetry:
  enabled: false

sandbox:
  driver: kubernetes
  image: ghcr.io/muniu-ai/muniu-sandbox:0.2.0
  imageDigest: ""
  serviceAccountName: ""
  runtimeClassName: ""
  sharedWorkspace:
    create: true
    existingClaim: ""
    storageClassName: ""
    accessModes: [ReadWriteMany]
    size: 20Gi
    mountPath: /work/sandboxes

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
