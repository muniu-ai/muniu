s3:
  endpoint: http://minio.storage.svc:9000
  bucket: muniu-v2-ci

oidc:
  issuer: https://oidc.example.test
  audience: muniu-v2-ci
  jwksUrl: https://oidc.example.test/.well-known/jwks.json

vault:
  address: https://vault.example.test
  existingSecret: muniu-vault-v2

sandbox:
  imageDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  runtimeClassName: muniu-sandbox

networkPolicy:
  kubernetesApiEgress:
    - ipBlock: { cidr: 10.96.0.1/32 }
  runtimeEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              muniu.ai/runtime-dependencies: "true"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9000 }
