apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: { name: muniu-sandbox }
handler: test-handler
---
apiVersion: batch/v1
kind: Job
metadata: { name: muniu-sandbox-probe, namespace: muniu-kind }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { muniu.ai/component: candidate-sandbox }
    spec:
      restartPolicy: Never
      serviceAccountName: muniu-candidate
      automountServiceAccountToken: false
      runtimeClassName: muniu-sandbox
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: probe
          image: muniu-kind:ci
          imagePullPolicy: Never
          command: [node, scripts/kind-sandbox-probe.mjs]
          env:
            - { name: MN_KIND_RUNTIME_CLASS, value: muniu-sandbox }
            - name: MN_KIND_IMAGE_DIGEST
              valueFrom: { configMapKeyRef: { name: muniu-kind-image, key: digest } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: workspace, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
