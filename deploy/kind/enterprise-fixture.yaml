# Disposable integration fixture; production uses an externally managed, durable Vault.
apiVersion: v1
kind: Secret
metadata: { name: muniu-vault-v2, namespace: muniu-kind }
type: Opaque
stringData:
  token: mn-kind-vault-fixture-only
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: muniu-kind-vault, namespace: muniu-kind }
spec:
  replicas: 1
  selector: { matchLabels: { app: muniu-kind-vault } }
  template:
    metadata:
      labels: { app: muniu-kind-vault, muniu.ai/runtime-dependency: "true" }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vault
          image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
          args: [server, -dev, -dev-root-token-id=mn-kind-vault-fixture-only, "-dev-listen-address=0.0.0.0:8200", -dev-no-store-token]
          env:
            - { name: SKIP_SETCAP, value: "true" }
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
          ports: [{ name: vault, containerPort: 8200 }]
          readinessProbe:
            exec: { command: [vault, status] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: { name: muniu-kind-vault, namespace: muniu-kind }
spec:
  selector: { app: muniu-kind-vault }
  ports: [{ name: vault, port: 8200, targetPort: vault }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: muniu-kind-vault-init, namespace: muniu-kind }
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: vault-init
          image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
          command: [/bin/sh, -ec]
          args:
            - |-
              until vault status; do sleep 1; done
              if ! vault secrets list -format=json | grep -q '"transit/"'; then
                vault secrets enable transit
              fi
          env:
            - { name: VAULT_ADDR, value: "http://muniu-kind-vault:8200" }
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: muniu-vault-v2, key: token } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: muniu-kind-postgres, namespace: muniu-kind }
spec:
  replicas: 1
  selector: { matchLabels: { app: muniu-kind-postgres } }
  template:
    metadata:
      labels: { app: muniu-kind-postgres, muniu.ai/runtime-dependency: "true" }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: mn }
            - { name: POSTGRES_PASSWORD, value: mn-kind-only }
            - { name: POSTGRES_DB, value: muniu }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, mn, -d, muniu] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: muniu-kind-postgres-v2 }
---
apiVersion: v1
kind: Service
metadata: { name: muniu-kind-postgres, namespace: muniu-kind }
spec:
  selector: { app: muniu-kind-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: muniu-kind-minio, namespace: muniu-kind }
spec:
  replicas: 1
  selector: { matchLabels: { app: muniu-kind-minio } }
  template:
    metadata:
      labels: { app: muniu-kind-minio, muniu.ai/runtime-dependency: "true" }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data]
          env:
            - { name: MINIO_ROOT_USER, value: mn-kind }
            - { name: MINIO_ROOT_PASSWORD, value: mn-kind-secret-only }
          ports: [{ name: s3, containerPort: 9000 }]
          readinessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: muniu-kind-minio-v2 }
---
apiVersion: v1
kind: Service
metadata: { name: muniu-kind-minio, namespace: muniu-kind }
spec:
  selector: { app: muniu-kind-minio }
  ports: [{ name: s3, port: 9000, targetPort: s3 }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: muniu-kind-minio-init, namespace: muniu-kind }
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: minio-client
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: [/bin/sh, -ec]
          args:
            - |-
              until mc alias set kind http://muniu-kind-minio:9000 mn-kind mn-kind-secret-only; do sleep 1; done
              mc mb --ignore-existing kind/muniu-kind-v2
              mc anonymous set none kind/muniu-kind-v2
---
