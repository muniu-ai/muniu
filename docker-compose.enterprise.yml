name: mn-enterprise-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mn
      POSTGRES_PASSWORD: mn-e2e-only
      POSTGRES_DB: mn_enterprise
    ports:
      - "55432:5432"
    volumes:
      - mn-enterprise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mn -d mn_enterprise"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [mn-enterprise, mn-host]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mn-e2e
      MINIO_ROOT_PASSWORD: mn-e2e-secret-only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - mn-enterprise-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [mn-enterprise, mn-host]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 mn-e2e mn-e2e-secret-only
        mc mb --ignore-existing local/mn-artifacts
        mc anonymous set none local/mn-artifacts
    restart: "no"
    networks: [mn-enterprise]

  jwks:
    image: node:22-alpine
    working_dir: /fixture
    command: ["node", "infra/jwks-server.mjs"]
    environment:
      JWKS_PORT: "8080"
      JWKS_ISSUER: http://jwks:8080
      JWKS_AUDIENCE: mn-enterprise
    ports:
      - "59080:8080"
    volumes:
      - ./examples/microservice-repo:/fixture:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [mn-enterprise, mn-host]

volumes:
  mn-enterprise-postgres:
  mn-enterprise-minio:

networks:
  mn-enterprise:
    driver: bridge
    internal: true
  mn-host:
    driver: bridge
