services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mn
      POSTGRES_PASSWORD: mn
      POSTGRES_DB: mn
    ports:
      - "5432:5432"
    volumes:
      - mn-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mn-redis:/data

volumes:
  mn-postgres:
  mn-redis:
