name: mn-v2-dependencies

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mn
      POSTGRES_PASSWORD: mn-local-only
      POSTGRES_DB: mn_v2
    ports: ["5432:5432"]
    volumes: ["mn-v2-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mn -d mn_v2"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mn-local
      MINIO_ROOT_PASSWORD: mn-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["mn-v2-minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mn-v2-postgres:
  mn-v2-minio:
