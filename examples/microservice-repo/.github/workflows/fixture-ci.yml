name: enterprise-microservice-fixture

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix examples/microservice-repo
      - run: node scripts/enterprise-e2e.mjs

