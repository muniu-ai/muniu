components:
  schemas:
    OrganizationView:
      type: object
      additionalProperties: false
      properties:
        id: &a1
          type: string
          minLength: 1
          maxLength: 200
        name: *a1
        issuer: *a1
        maxMembers: &a2
          type: integer
          minimum: 1
          maximum: 9007199254740991
        streamVersion: *a2
      required:
        - id
        - name
        - issuer
        - maxMembers
        - streamVersion
    OrganizationList:
      type: array
      items:
        $ref: "#/components/schemas/OrganizationView"
    OrganizationMemberView:
      type: object
      additionalProperties: false
      properties:
        id: *a1
        tenantId: *a1
        issuer: *a1
        subject: *a1
        displayName: *a1
        organizationAdmin: &a3
          type: boolean
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
            - removed
        streamVersion: *a2
        sessionEpoch: *a2
        invitedUntil: &a4
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - issuer
        - subject
        - displayName
        - organizationAdmin
        - status
        - streamVersion
        - sessionEpoch
    OrganizationMemberList:
      type: array
      items:
        $ref: "#/components/schemas/OrganizationMemberView"
    EnterpriseWorkspaceView:
      type: object
      additionalProperties: false
      properties:
        id: *a1
        tenantId: *a1
        name: *a1
        mode:
          type: string
          enum:
            - builtin
            - sales
        streamVersion: *a2
      required:
        - id
        - tenantId
        - name
        - mode
        - streamVersion
    EnterpriseWorkspaceList:
      type: array
      items:
        $ref: "#/components/schemas/EnterpriseWorkspaceView"
    EnterpriseWorkspaceCreate:
      type: object
      additionalProperties: false
      properties:
        name: *a1
        mode:
          type: string
          enum:
            - builtin
            - sales
      required:
        - name
        - mode
    OrganizationInvitationCreate:
      type: object
      additionalProperties: false
      properties:
        subject: *a1
        displayName: *a1
        organizationAdmin: *a3
      required:
        - subject
        - displayName
        - organizationAdmin
    OrganizationInvitationView:
      type: object
      additionalProperties: false
      properties:
        id: *a1
        member:
          $ref: "#/components/schemas/OrganizationMemberView"
        token: *a1
      required:
        - id
        - member
        - token
    OrganizationInvitationAccept:
      type: object
      additionalProperties: false
      properties:
        expectedStreamVersion: *a2
        token: *a1
      required:
        - expectedStreamVersion
        - token
    OrganizationMemberCommand:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            expectedStreamVersion: *a2
            type:
              type: string
              enum:
                - disable
                - activate
                - remove
          required:
            - expectedStreamVersion
            - type
        - type: object
          additionalProperties: false
          properties:
            expectedStreamVersion: *a2
            type:
              const: rebind
            subject: *a1
          required:
            - expectedStreamVersion
            - type
            - subject
    EnterpriseSessionView:
      type: object
      additionalProperties: false
      properties:
        tenantId: *a1
        principalId: *a1
        displayName: *a1
        status:
          type: string
          enum:
            - invited
            - active
        organizationAdmin: *a3
        csrfToken: *a1
        expiresAt: *a4
        profile:
          type: string
          enum:
            - development
            - hosted
      required:
        - tenantId
        - principalId
        - displayName
        - status
        - organizationAdmin
        - csrfToken
        - expiresAt
        - profile
    EnterpriseHealthView:
      type: object
      additionalProperties: false
      properties:
        status:
          const: healthy
        profile:
          type: string
          enum:
            - development
            - hosted
      required:
        - status
        - profile
    EnterpriseApiError:
      type: object
      additionalProperties: false
      properties:
        code: *a1
        message: *a1
        action: *a1
        traceId: *a1
        retryable: *a3
        fieldIssues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *a1
              message: *a1
            required:
              - field
              - message
      required:
        - code
        - message
        - action
        - traceId
        - retryable
        - fieldIssues
    BusinessObjectRef:
      type: object
      additionalProperties: false
      properties:
        tenantId: &a5
          type: string
          minLength: 1
        workspaceId: *a5
        objectType:
          type: string
          enum:
            - operating_objective
            - metric_definition
            - business_review
            - customer
            - contact
            - opportunity
            - service_version
            - quote_version
            - contract
            - order
            - project
            - milestone
            - delivery_version
            - customer_acceptance
            - change_request
            - payment_schedule
            - receipt
            - refund
            - expense
            - adjustment
            - goal
            - artifact_version
            - evidence_ref
            - decision_record
            - memory_entry
        objectId: *a5
        streamVersion: &a7
          type: integer
          minimum: 1
