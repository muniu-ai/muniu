          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMemberCommand"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationMemberView"
                  traceId:
                    type: string
        "400":
          description: 请求格式无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "401":
          description: 登录或会话无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "403":
          description: 当前权限或跨站防护拒绝
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "404":
          description: 当前作用域不存在该对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "409":
          description: 版本或幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "413":
          description: 请求过大
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "415":
          description: 正文类型无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
        "503":
          description: 服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseApiError"
  /v2/auth/login:
    get:
      operationId: enterpriseLogin
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 跳转至已配置 OIDC 提供方
  /v2/auth/callback:
    get:
      operationId: enterpriseLoginCallback
      description: state、nonce、PKCE 和单次浏览器绑定校验；不接受业务命令
      responses:
        "303":
          description: 设置 HttpOnly 会话并返回工作台
        "401":
          description: 登录校验失败
  /v2/auth/logout:
    post:
      operationId: enterpriseLogout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 会话已撤销
        "403":
          description: 跨站防护拒绝
