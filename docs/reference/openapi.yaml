openapi: 3.1.0
info:
  title: Muniu Agent OS API
  version: 0.2.0
paths:
  /v2/business-actions:
    post:
      operationId: createBusinessAction
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessActionMutation"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessActionV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/business-actions/{actionId}:
    get:
      operationId: getBusinessAction
      parameters:
        - in: path
          name: actionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessActionV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/business-actions/{actionId}/reconciliation-decisions:
    post:
      operationId: reconcileBusinessAction
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: actionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileBusinessActionMutation"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessActionV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/business-actions/{actionId}/execution-authority:
    get:
      operationId: getBusinessExecutionAuthority
      parameters:
        - in: path
          name: actionId
          required: true
          schema:
            type: string
        - in: query
          name: tenantId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: executionId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: jobId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: workerId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: generation
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: fencingToken
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - allowed
                      - actionDigest
                      - expiresAt
                      - leaseExpiresAt
                      - actionId
                      - operationKey
                    properties:
                      allowed:
                        type: boolean
                        const: true
                      actionDigest:
                        type: string
                      expiresAt:
                        type: string
                      leaseExpiresAt:
                        type: string
                      actionId:
                        type: string
                      operationKey:
                        type: string
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
      x-muniu-service-auth: Dedicated business service bearer credential with explicit workspace scopes
  /v2/business-candidates:
