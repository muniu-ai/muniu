openapi: 3.1.0
info:
  title: Muniu Agent OS API
  version: 0.2.0
paths:
  /v2/workspaces/{workspaceId}/agent-readiness:
    get:
      operationId: getWorkspaceAgentReadiness
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputAgentReadinessReportV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/model-connections/{connectionId}/model:
    post:
      operationId: selectModelConnectionModel
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: connectionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedStreamVersion
                - modelName
              properties:
                expectedStreamVersion:
                  type: integer
                  minimum: 0
                modelName:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputModelConnectionV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/plugins/opc/business:
    get:
      operationId: getOpcBusiness
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: periodStart
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: periodEnd
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessManagementViewV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/plugins/opc/business/commands:
    post:
      operationId: commandOpcBusiness
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - workspaceId
                - expectedStreamVersion
                - command
              properties:
                workspaceId: &a2
                  type: string
                  minLength: 1
                  maxLength: 4000
                  pattern: \S
                expectedStreamVersion:
                  type: integer
                  minimum: 0
                command:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - planId
                        - title
                        - period
                        - targetCustomer
                        - valueProposition
                        - focus
                        - resources
                        - reviewOn
                      properties:
                        type:
                          const: plan.record
                        planId: &a3
                          type: string
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
                        title: &a4
                          type: string
                          minLength: 1
                          maxLength: 200
                          pattern: \S
                        period: &a11
                          type: object
                          additionalProperties: false
                          required:
                            - start
                            - end
                          properties:
                            start: &a1
                              type: string
                              format: date
                              pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$
                            end: *a1
                        targetCustomer: *a2
                        valueProposition: *a2
                        focus: &a6
                          type: array
                          items: &a5
                            type: string
                            minLength: 1
                            maxLength: 2000
                            pattern: \S
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                        resources: *a2
                        reviewOn: *a1
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - customerId
                        - name
                        - source
                        - need
                      properties:
                        type:
                          const: customer.record
                        customerId: *a3
                        name: *a4
                        source: *a5
                        need: *a2
                        contact:
                          type: string
                          minLength: 1
                          maxLength: 500
                          pattern: \S
                        followUpOn: *a1
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - serviceId
                        - title
                        - currency
                        - priceMinor
                        - inScope
                        - outOfScope
                        - acceptanceCriteria
                      properties:
                        type:
                          const: service.record
                        serviceId: *a3
                        title: *a4
                        currency:
                          const: CNY
                        priceMinor: &a7
                          type: string
                          pattern: ^(0|[1-9][0-9]{0,23})$
                        inScope: *a6
                        outOfScope:
                          type: array
                          items: *a5
                          minItems: 0
                          maxItems: 50
                          uniqueItems: true
                        acceptanceCriteria: *a6
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - quoteId
                        - customerId
                        - serviceId
                        - serviceVersion
                        - quantity
                        - discountMinor
                        - validUntil
                        - dueOn
                      properties:
                        type:
                          const: quote.create
                        quoteId: *a3
                        customerId: *a3
                        serviceId: *a3
                        serviceVersion: &a8
                          type: integer
                          minimum: 1
                          maximum: 1000000
                        quantity: &a9
                          type: integer
                          minimum: 1
                          maximum: 10000
                        discountMinor: *a7
                        validUntil: *a1
                        dueOn: *a1
                        notes: *a2
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - quoteId
                        - orderId
                        - confirmedOn
                        - sourceRef
                      properties:
                        type:
                          const: quote.confirm
                        quoteId: *a3
                        orderId: *a3
                        confirmedOn: *a1
                        sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - orderId
                        - customerId
                        - serviceId
                        - serviceVersion
                        - quantity
                        - agreedAmountMinor
                        - contractedOn
                        - dueOn
                        - sourceRef
                        - opening
                      properties:
                        type:
                          const: order.record
                        orderId: *a3
                        customerId: *a3
                        serviceId: *a3
                        serviceVersion: *a8
                        quantity: *a9
                        agreedAmountMinor: *a7
                        contractedOn: *a1
                        dueOn: *a1
                        sourceRef: *a5
                        opening:
                          type: object
                          additionalProperties: false
                          required:
                            - asOf
                            - receivedMinor
                            - deliveredPercent
                            - accepted
                            - sourceRef
                          properties:
                            asOf: *a1
                            receivedMinor: *a7
                            deliveredPercent:
                              type: integer
                              minimum: 0
                              maximum: 100
                            accepted:
                              type: boolean
                            sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - adjustmentId
                        - orderId
                        - amountDeltaMinor
                        - effectiveOn
                        - reason
                        - sourceRef
                      properties:
                        type:
                          const: order.adjust
                        adjustmentId: *a3
                        orderId: *a3
                        amountDeltaMinor:
                          type: string
                          pattern: ^(0|-?[1-9][0-9]{0,23})$
                        effectiveOn: *a1
                        dueOn: *a1
                        reason: *a2
                        sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - deliveryId
                        - orderId
                        - title
                        - deliveredOn
                        - artifactRef
                        - progressPercent
                      properties:
                        type:
                          const: delivery.record
                        deliveryId: *a3
                        orderId: *a3
                        title: *a4
                        deliveredOn: *a1
                        artifactRef: *a5
                        progressPercent:
                          type: integer
                          minimum: 1
                          maximum: 100
                        notes: *a2
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - acceptanceId
                        - orderId
                        - deliveryIds
                        - acceptedOn
                        - customerConfirmationRef
                        - complete
                      properties:
                        type:
                          const: acceptance.record
                        acceptanceId: *a3
                        orderId: *a3
                        deliveryIds:
                          type: array
                          items: *a3
                          minItems: 0
                          maxItems: 100
                          uniqueItems: true
                        acceptedOn: *a1
                        customerConfirmationRef: *a5
                        complete:
                          type: boolean
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - paymentId
                        - orderId
                        - amountMinor
                        - receivedOn
                        - sourceRef
                      properties:
                        type:
                          const: payment.record
                        paymentId: *a3
                        orderId: *a3
                        amountMinor: &a10
                          type: string
                          pattern: ^[1-9][0-9]{0,23}$
                        receivedOn: *a1
                        sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - reversalId
                        - paymentId
                        - reversedOn
                        - reason
                        - sourceRef
                      properties:
                        type:
                          const: payment.reverse
                        reversalId: *a3
                        paymentId: *a3
                        reversedOn: *a1
                        reason: *a2
                        sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - refundId
                        - amountMinor
                        - refundedOn
                        - reason
                        - sourceRef
                      properties:
                        type:
                          const: refund.record
                        refundId: *a3
                        paymentId: *a3
                        openingOrderId: *a3
                        amountMinor: *a10
                        refundedOn: *a1
                        reason: *a2
                        sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - expenseId
                        - category
                        - description
                        - amountMinor
                        - paidOn
                        - sourceRef
                      properties:
                        type:
                          const: expense.record
                        expenseId: *a3
                        orderId: *a3
                        category: *a4
                        description: *a2
                        amountMinor: *a10
                        paidOn: *a1
                        sourceRef: *a5
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - reviewId
                        - period
                        - explanation
                        - nextDecisions
                      properties:
                        type:
                          const: review.record
                        reviewId: *a3
                        period: *a11
                        explanation: *a2
                        nextDecisions: *a6
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessManagementViewV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/goals:
    get:
      operationId: listGoals
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutputGoalV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
    post:
      operationId: createGoal
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - threadId
                - objective
                - resourceRefs
                - budget
                - deliverables
              properties:
                threadId: &a12
                  type: string
                  minLength: 1
                  maxLength: 200
                objective:
                  type: string
                  minLength: 1
                  maxLength: 16000
                resourceRefs:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - namespace
                      - resourceId
                      - streamVersion
                    properties:
                      namespace: *a12
                      resourceId: *a12
                      streamVersion:
                        type: integer
                        minimum: 0
                      digest: *a12
                  minItems: 0
                  maxItems: 100
                budget:
                  type: object
                  additionalProperties: false
                  required:
                    - maxTokens
                    - maxCostMinorUnits
                    - currency
                    - maxDurationMs
                  properties:
                    maxTokens:
                      type: integer
                      minimum: 1
                    maxCostMinorUnits:
                      type: string
                      pattern: ^(0|[1-9][0-9]{0,23})$
                    currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                    maxDurationMs:
                      type: integer
                      minimum: 1
                deliverables:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - key
                      - title
                      - required
                      - criteria
                    properties:
                      key: *a12
                      title: *a12
                      required:
                        type: boolean
                      criteria:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - id
                            - description
                          properties:
                            id: *a12
                            description:
                              type: string
                              minLength: 1
                              maxLength: 2000
                        minItems: 1
                        maxItems: 20
                  minItems: 1
                  maxItems: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputGoalDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/goals/{goalId}:
    get:
      operationId: getGoal
      parameters:
        - in: path
          name: goalId
          required: true
          schema:
            type: string
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputGoalDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/goals/{goalId}/plan-revisions:
    post:
      operationId: proposeGoalPlan
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: goalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - workspaceId
                - expectedStreamVersion
              properties:
                workspaceId: &a13
                  type: string
                  minLength: 1
                  maxLength: 200
                expectedStreamVersion:
                  type: integer
                  minimum: 0
                modelBindingId: *a13
                scheduling:
                  type: object
                  additionalProperties: false
                  required:
                    - runnerId
                    - strategy
                  properties:
                    runnerId:
                      enum:
                        - auto
                        - builtin
                        - codex-cli
                        - claude-cli
                    strategy:
                      enum:
                        - quality
                        - balanced
                        - cost
                    modelBindingId: *a13
                    expectedValueMinorUnits: &a14
                      type: string
                      pattern: ^(0|[1-9][0-9]{0,17})$
                    timeCostMinorUnitsPerHour: *a14
              oneOf:
                - required:
                    - modelBindingId
                - required:
                    - scheduling
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputGoalDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/goals/{goalId}/commands:
    post:
      operationId: commandGoal
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: goalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - workspaceId
                    - expectedStreamVersion
                    - command
                    - usage
                    - source
                  properties:
                    workspaceId: &a16
                      type: string
                      minLength: 1
                      maxLength: 200
                    expectedStreamVersion: &a15
                      type: integer
                      minimum: 0
                    command:
                      const: record_external_usage
                    source:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    usage:
                      type: object
                      additionalProperties: false
                      required:
                        - tokens
                        - costMinorUnits
                        - currency
                      properties:
                        tokens: *a15
                        costMinorUnits:
                          type: string
                          pattern: ^(0|[1-9][0-9]{0,17})$
                        currency:
                          type: string
                          pattern: ^[A-Z]{3}$
                - type: object
                  additionalProperties: false
                  required:
                    - workspaceId
                    - expectedStreamVersion
                    - command
                    - planRevisionId
                    - planDigest
                  properties:
                    workspaceId: *a16
                    expectedStreamVersion: *a15
                    command:
                      const: start
                    planRevisionId: *a16
                    planDigest: *a16
                - type: object
                  additionalProperties: false
                  required:
                    - workspaceId
                    - expectedStreamVersion
                    - command
                  properties:
                    workspaceId: *a16
                    expectedStreamVersion: *a15
                    command:
                      enum:
                        - refresh
                        - cancel
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputGoalDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/goals/{goalId}/acceptances:
    post:
      operationId: acceptGoalDelivery
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: goalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - workspaceId
                - expectedStreamVersion
                - deliverySetId
                - criteriaVersion
                - items
              properties:
                workspaceId: &a17
                  type: string
                  minLength: 1
                  maxLength: 200
                expectedStreamVersion:
                  type: integer
                  minimum: 0
                deliverySetId: *a17
                criteriaVersion: *a17
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - key
                      - digest
                      - reviewedCriterionIds
                    properties:
                      key: *a17
                      digest: *a17
                      reviewedCriterionIds:
                        type: array
                        items: *a17
                        minItems: 1
                        maxItems: 20
                  minItems: 1
                  maxItems: 20
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputGoalDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/business-actions:
    post:
      operationId: createBusinessAction
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessActionMutation"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessActionV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/business-actions/{actionId}:
    get:
