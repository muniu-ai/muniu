          schema:
            type: string
          description: 插件领域内的相对资源或命令路径
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedMutation"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
      x-muniu-versioned: true
      x-muniu-greedy-path: true
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: integer
        minimum: 0
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Conflict:
      description: stream version 或幂等键冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CursorExpired:
      description: 事件游标已超出保留期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Error:
      description: 统一错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Mutation:
      type: object
      additionalProperties: true
    VersionedMutation:
      type: object
      required:
        - expectedStreamVersion
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 0
      additionalProperties: true
    CreateAssetsMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - attachments
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
        attachments:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - fileName
              - mediaType
              - contentBase64
            properties:
              fileName:
                type: string
                minLength: 1
              mediaType:
                type: string
                enum:
                  - text/plain
                  - text/markdown
                  - application/json
                  - text/csv
                  - application/pdf
                  - image/png
                  - image/jpeg
                  - image/webp
              contentBase64:
                type: string
                contentEncoding: base64
              protected:
                type: boolean
                default: false
    DeleteAssetMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - reason
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
    Envelope:
      type: object
      required:
        - data
        - traceId
      properties:
        data: {}
        traceId:
          type: string
    FieldIssue:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
        - action
        - fieldIssues
        - traceId
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        action:
          type: string
        fieldIssues:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"
        traceId:
          type: string
        retryable:
          type: boolean
