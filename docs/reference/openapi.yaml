        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
      x-muniu-service-auth: Dedicated business service bearer credential with explicit workspace scopes
  /v2/plugins/{pluginId}/{commandId}:
    post:
      operationId: runPluginCommand
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: pluginId
          required: true
          schema:
            type: string
        - in: path
