                - viewMode
                - pluginIds
              properties:
                name: &a2
                  type: string
                  minLength: 1
                viewMode:
                  enum:
                    - business
                    - professional
                pluginIds:
                  type: array
                  items: *a2
              additionalProperties: false
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
