components:
  schemas:
    ApiEnvelope:
      type: object
      required:
        - data
        - traceId
      properties:
        data: {}
        traceId:
          type: string
    RunnerBinaryInspectionEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - traceId
      properties:
        data:
          $ref: "#/components/schemas/RunnerBinaryInspection"
        traceId:
          type: string
    RunnerBinaryInspection:
      type: object
      additionalProperties: false
      required:
        - requestedPath
        - realPath
        - sha256
        - device
        - inode
        - byteLength
        - modifiedAtMs
      properties:
        requestedPath:
          type: string
          minLength: 1
        realPath:
          type: string
          minLength: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        device:
          type: string
          minLength: 1
        inode:
          type: string
          minLength: 1
        byteLength:
          type: integer
          minimum: 1
        modifiedAtMs:
          type: number
          minimum: 0
    CodingReconciliationEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - traceId
      properties:
        data:
          $ref: "#/components/schemas/CodingReconciliation"
        traceId:
          type: string
    CodingReconciliation:
      type: object
      additionalProperties: false
      required:
        - executionId
        - workspaceId
        - taskTitle
        - nextStep
        - runnerId
        - status
        - expectedStreamVersion
        - expectedCodingStreamVersion
        - evidence
        - newCall
        - availableDecisions
      properties:
        executionId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1
        taskTitle:
          type: string
          minLength: 1
        nextStep:
          type: string
          minLength: 1
        runnerId:
          type: string
          enum:
            - claude-cli
            - codex-cli
        status:
          type: string
          const: needs_reconciliation
        expectedStreamVersion:
          type: integer
          minimum: 1
        expectedCodingStreamVersion:
          type: integer
          minimum: 1
        evidence:
          type: object
          additionalProperties: false
          required:
            - candidateCount
            - gateCount
            - markCompletedAllowed
            - summary
          properties:
            candidateCount:
              type: integer
              minimum: 0
            gateCount:
              type: integer
              minimum: 0
            markCompletedAllowed:
              type: boolean
            codeEvidenceDigest:
              type: string
              pattern: ^[0-9a-f]{64}$
            summary:
              type: string
              minLength: 1
        newCall:
          type: object
          additionalProperties: false
          required:
            - allowed
            - summary
          properties:
            allowed:
              type: boolean
            summary:
              type: string
              minLength: 1
        availableDecisions:
          type: array
          minItems: 0
          uniqueItems: true
          items:
            type: string
            enum:
              - terminate
              - mark_completed
              - create_new_call
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - action
        - fieldIssues
        - traceId
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        action:
          type: string
        fieldIssues:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
        traceId:
          type: string
        retryable:
          type: boolean
    VersionedMutation:
      type: object
      required:
        - expectedStreamVersion
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 0
      additionalProperties: true
    CreateAssetsMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - attachments
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
        attachments:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - fileName
              - mediaType
              - contentBase64
            properties:
              fileName:
                type: string
                minLength: 1
              mediaType:
                type: string
                enum:
                  - text/plain
                  - text/markdown
                  - application/json
                  - text/csv
                  - application/pdf
                  - image/png
                  - image/jpeg
                  - image/webp
              contentBase64:
                type: string
                contentEncoding: base64
              protected:
                type: boolean
                default: false
    DeleteAssetMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - reason
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
    OpcOpportunityCommandMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - command
        - input
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          minimum: 1
        command:
          type: string
          minLength: 1
        input:
          type: object
          additionalProperties: true
      allOf:
        - if:
            required:
              - command
            properties:
              command:
                const: record_interview
          then:
            properties:
              input:
                type: object
                required:
                  - interviewId
                  - participantRef
                  - occurredAt
                  - rawRecordAssetId
                not:
                  required:
                    - rawRecord
        - if:
            required:
              - command
              - input
            properties:
              command:
                const: record_signal
              input:
                type: object
                required:
                  - sourceKind
                properties:
                  sourceKind:
                    const: file
          then:
            properties:
              input:
                type: object
                required:
                  - sourceAssetId
    CreateTurnMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - message
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 0
        message:
          type: string
          minLength: 1
        agentDefinitionId:
          type: string
          minLength: 1
        modelBindingId:
          type: string
          minLength: 1
        runnerId:
          type: string
          enum:
            - builtin
            - claude-cli
            - codex-cli
    InspectCodingRunnerMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - binaryPath
      properties:
        workspaceId:
          type: string
          minLength: 1
        binaryPath:
          type: string
          minLength: 1
          pattern: ^/
    ConfirmCodingRunnerMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - binaryPath
        - version
        - sha256
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          minimum: 0
        binaryPath:
          type: string
          minLength: 1
          pattern: ^/
        version:
          type: string
          minLength: 1
          maxLength: 256
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    DecideCodingReconciliationMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - expectedCodingStreamVersion
        - decision
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 1
        expectedCodingStreamVersion:
          type: integer
          minimum: 1
        decision:
          type: string
          enum:
            - terminate
            - mark_completed
            - create_new_call
    CreateProductObjectMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - input
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
        input:
          type: string
          minLength: 1
    RunReadOnlySampleMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
  responses:
    BadRequest:
      description: 请求无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 需要认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 流版本或幂等键冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CursorExpired:
      description: 事件游标已过保留期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: 请求不符合领域约束
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
