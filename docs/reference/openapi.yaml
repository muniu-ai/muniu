openapi: 3.1.0
info:
  title: Muniu Agent OS API
  version: 0.2.0
paths:
  /v2/workspaces/{workspaceId}/team-skills:
    get:
      operationId: listTeamSkills
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: goalId
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputTeamSkillListV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
    post:
      operationId: createTeamSkillVersion
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - skillId
                - expectedStreamVersion
                - source
                - title
                - description
                - roles
              properties:
                skillId: &a1
                  type: string
                  minLength: 1
                  maxLength: 200
                  pattern: \S
                expectedStreamVersion: &a4
                  type: integer
                  minimum: 0
                source:
                  type: object
                  additionalProperties: false
                  required:
                    - goalId
                    - planRevisionId
                    - deliverySetId
                    - deliveryDigest
                  properties:
                    goalId: *a1
                    planRevisionId: *a1
                    deliverySetId: *a1
                    deliveryDigest: &a2
                      type: string
                      pattern: ^[a-f0-9]{64}$
                title: *a1
                description:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  pattern: \S
                roles:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - nodeId
                      - instructions
                      - sourceRefs
                    properties:
                      nodeId: *a1
                      instructions:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        pattern: \S
                      sourceRefs:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - namespace
                            - resourceId
                            - streamVersion
                            - digest
                          properties:
                            namespace: *a1
                            resourceId: *a1
                            streamVersion:
                              type: integer
                              minimum: 1
                            digest: *a2
                        minItems: 0
                        maxItems: 20
                  minItems: 0
                  maxItems: 12
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputTeamSkillDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/team-skills/{skillId}:
    get:
      operationId: getTeamSkill
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: skillId
          required: true
          schema:
            type: string
        - in: query
          name: version
          required: false
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,5}$
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputTeamSkillDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/workspaces/{workspaceId}/team-skills/{skillId}/evaluations:
    post:
      operationId: registerTeamSkillEvaluation
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: skillId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedStreamVersion
                - skillRef
                - executionMode
                - baselineRevision
                - candidateRevision
                - configuration
              properties:
                expectedStreamVersion:
                  const: 0
                skillRef:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - version
                    - digest
                  properties:
                    id: *a1
                    version:
                      type: string
                      pattern: ^[1-9][0-9]{0,5}$
                    digest: *a2
                executionMode:
                  enum:
                    - measured
                    - test_fixture
                baselineRevision: &a3
                  type: string
                  pattern: ^[a-f0-9]{40}$
                candidateRevision: *a3
                configuration:
                  type: object
                  additionalProperties: false
                  required:
                    - model
                    - promptSha256
                    - policySha256
                    - materialsSha256
                    - budget
                  properties:
                    model:
                      type: object
                      additionalProperties: false
                      required:
                        - provider
                        - name
                        - revision
                        - parameters
                      properties:
                        provider: *a1
                        name: *a1
                        revision: *a1
                        parameters:
                          type: object
                          additionalProperties: false
                          required:
                            - temperature
                          properties:
                            temperature:
                              type: number
                              minimum: 0
                              maximum: 2
                    promptSha256: *a2
                    policySha256: *a2
                    materialsSha256: *a2
                    budget:
                      type: object
                      additionalProperties: false
                      required:
                        - revision
                        - maxTokens
                        - maxCostMinorUnits
                        - currency
                      properties:
                        revision:
                          const: budget-v1
                        maxTokens:
                          type: integer
                          minimum: 1
                        maxCostMinorUnits:
                          type: string
                          pattern: ^(0|[1-9][0-9]{0,29})$
                        currency:
                          type: string
                          pattern: ^[A-Z]{3}$
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputTeamSkillEvaluationV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/team-skills/{skillId}/evaluations/{evaluationId}/results:
    post:
      operationId: submitTeamSkillEvaluation
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: skillId
          required: true
          schema:
            type: string
        - in: path
          name: evaluationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedStreamVersion
                - reportRef
                - evidence
              properties:
                expectedStreamVersion:
                  type: integer
                  minimum: 1
                reportRef:
                  type: object
                  additionalProperties: false
                  required:
                    - namespace
                    - resourceId
                    - streamVersion
                    - digest
                  properties:
                    namespace: *a1
                    resourceId: *a1
                    streamVersion:
                      type: integer
                      minimum: 1
                    digest: *a2
                evidence:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - artifactRef
                          - artifactSha256
                          - method
                          - reviewer
                        properties:
                          artifactRef:
                            type: object
                            additionalProperties: false
                            required:
                              - namespace
                              - resourceId
                              - streamVersion
                              - digest
                            properties:
                              namespace: *a1
                              resourceId: *a1
                              streamVersion:
                                type: integer
                                minimum: 1
                              digest: *a2
                          artifactSha256: *a2
                          method:
                            const: human
                          reviewer: *a1
                      - type: object
                        additionalProperties: false
                        required:
                          - artifactRef
                          - artifactSha256
                          - method
                          - check
                        properties:
                          artifactRef:
                            type: object
                            additionalProperties: false
                            required:
                              - namespace
                              - resourceId
                              - streamVersion
                              - digest
                            properties:
                              namespace: *a1
                              resourceId: *a1
                              streamVersion:
                                type: integer
                                minimum: 1
                              digest: *a2
                          artifactSha256: *a2
                          method:
                            const: deterministic
                          check: *a1
                  minItems: 1
                  maxItems: 2000
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputTeamSkillEvaluationV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/team-skills/{skillId}/commands:
    post:
      operationId: commandTeamSkill
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: skillId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - expectedStreamVersion
                    - command
                  properties:
                    expectedStreamVersion: *a4
                    command:
                      const: disable
                - type: object
                  additionalProperties: false
                  required:
                    - expectedStreamVersion
                    - command
                    - skillRef
                    - evaluationId
                    - recommendationEnabled
                  properties:
                    expectedStreamVersion: *a4
                    command:
                      enum:
                        - enable
                        - rollback
                    skillRef:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - version
                        - digest
                      properties:
                        id: *a1
                        version:
                          type: string
                          pattern: ^[1-9][0-9]{0,5}$
                        digest: *a2
                    evaluationId: *a1
                    recommendationEnabled:
                      type: boolean
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputTeamSkillActivationV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/followups:
    get:
      operationId: listFollowups
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutputFollowupDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
    post:
      operationId: createFollowup
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedStreamVersion
                - parentGoalId
                - expectedGoalStreamVersion
                - parentPlanDigest
                - title
                - instruction
                - enabled
                - trigger
                - resourceRefs
                - modelBindingId
                - perRunBudget
                - periodBudget
                - maxRuns
                - expiresAt
              properties:
                expectedStreamVersion:
                  const: 0
                parentGoalId: &a5
                  type: string
                  minLength: 1
                  maxLength: 200
                expectedGoalStreamVersion: &a6
                  type: integer
                  minimum: 1
                parentPlanDigest: *a5
                title: *a5
                instruction:
                  type: string
                  minLength: 1
                  maxLength: 4000
                enabled:
                  const: true
                trigger:
                  type: object
                  additionalProperties: false
                  required:
                    - kind
                    - sourceRef
                  properties:
                    kind:
                      const: business_changed
                    sourceRef: &a7
                      type: object
                      additionalProperties: false
                      required:
                        - namespace
                        - resourceId
                        - streamVersion
                        - digest
                      properties:
                        namespace: *a5
                        resourceId: *a5
                        streamVersion: *a6
                        digest:
                          type: string
                          pattern: ^[a-f0-9]{64}$
                resourceRefs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: *a7
                modelBindingId: *a5
                perRunBudget:
                  type: object
                  additionalProperties: false
                  required:
                    - maxTokens
                    - maxCostMinorUnits
                    - currency
                    - maxDurationMs
                  properties:
                    maxTokens: *a6
                    maxCostMinorUnits: &a8
                      type: string
                      pattern: ^(0|[1-9][0-9]{0,15})$
                    currency: &a9
                      type: string
                      pattern: ^[A-Z]{3}$
                    maxDurationMs: *a6
                periodBudget:
                  type: object
                  additionalProperties: false
                  required:
                    - periodMs
                    - maxRuns
                    - maxTokens
                    - maxCostMinorUnits
                    - currency
                  properties:
                    periodMs:
                      enum:
                        - 86400000
                        - 604800000
                    maxRuns:
                      type: integer
                      minimum: 1
                      maximum: 1000
                    maxTokens: *a6
                    maxCostMinorUnits: *a8
                    currency: *a9
                maxRuns:
                  type: integer
                  minimum: 1
                  maximum: 1000
                expiresAt: *a5
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputFollowupDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/followups/{policyId}:
    get:
      operationId: getFollowup
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: policyId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputFollowupDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/workspaces/{workspaceId}/followups/{policyId}/commands:
    post:
      operationId: commandFollowup
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: policyId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedStreamVersion
                - command
              properties:
                expectedStreamVersion:
                  type: integer
                  minimum: 1
                command:
                  enum:
                    - pause
                    - resume
                    - stop
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputFollowupDetailV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/workspaces/{workspaceId}/business-context/{kind}/{resourceId}:
    get:
      operationId: getBusinessContext
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
        - in: query
          name: version
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: digest
          required: false
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessObjectContextV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/workspaces/{workspaceId}/agent-readiness:
    get:
      operationId: getWorkspaceAgentReadiness
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputAgentReadinessReportV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/model-connections/{connectionId}/model:
    post:
      operationId: selectModelConnectionModel
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - in: path
          name: connectionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedStreamVersion
                - modelName
              properties:
                expectedStreamVersion:
                  type: integer
                  minimum: 0
                modelName:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputModelConnectionV2"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: true
  /v2/plugins/opc/business:
    get:
      operationId: getOpcBusiness
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: periodStart
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: periodEnd
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessManagementViewV1"
                  traceId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "422":
          $ref: "#/components/responses/Unprocessable"
      x-muniu-versioned: false
  /v2/plugins/opc/business/commands:
    post:
