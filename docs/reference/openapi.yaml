              properties:
                workspaceId:
                  type: string
                  minLength: 1
                expectedStreamVersion:
                  type: integer
                  minimum: 0
              additionalProperties: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
