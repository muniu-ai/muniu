          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: principalId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: customerId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - traceId
                properties:
                  data:
                    $ref: "#/components/schemas/OutputBusinessCandidateContentV1"
