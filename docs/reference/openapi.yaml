          type: array
          minItems: 0
          uniqueItems: true
          items:
            type: string
            enum:
              - terminate
              - mark_completed
              - create_new_call
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - action
        - fieldIssues
        - traceId
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        action:
          type: string
        fieldIssues:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
        traceId:
          type: string
        retryable:
          type: boolean
    VersionedMutation:
      type: object
      required:
        - expectedStreamVersion
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 0
      additionalProperties: true
    CreateAssetsMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - attachments
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
        attachments:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - fileName
              - mediaType
              - contentBase64
            properties:
              fileName:
                type: string
                minLength: 1
              mediaType:
                type: string
                enum:
                  - text/plain
                  - text/markdown
                  - application/json
                  - text/csv
                  - application/pdf
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                  - image/png
                  - image/jpeg
                  - image/webp
              contentBase64:
                type: string
                contentEncoding: base64
              protected:
                type: boolean
                default: false
    DeleteAssetMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - reason
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
    OpcOpportunityCommandMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - command
        - input
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          minimum: 1
        command:
          type: string
          minLength: 1
        input:
          type: object
          additionalProperties: true
      allOf:
        - if:
            required:
              - command
            properties:
              command:
                const: record_interview
          then:
            properties:
              input:
                type: object
                required:
                  - interviewId
                  - participantRef
                  - occurredAt
                  - rawRecordAssetId
                not:
                  required:
                    - rawRecord
        - if:
            required:
              - command
              - input
            properties:
              command:
                const: record_signal
              input:
                type: object
                required:
                  - sourceKind
                properties:
                  sourceKind:
                    const: file
          then:
            properties:
              input:
                type: object
                required:
                  - sourceAssetId
    CreateTurnMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - message
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 0
        message:
          type: string
          minLength: 1
        agentDefinitionId:
          type: string
          minLength: 1
        modelBindingId:
          type: string
          minLength: 1
        runnerId:
          type: string
          enum:
            - builtin
            - claude-cli
            - codex-cli
    InspectCodingRunnerMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - binaryPath
      properties:
        workspaceId:
          type: string
          minLength: 1
        binaryPath:
          type: string
          minLength: 1
          pattern: ^/
    ConfirmCodingRunnerMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - binaryPath
        - version
        - sha256
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          minimum: 0
        binaryPath:
          type: string
          minLength: 1
          pattern: ^/
        version:
          type: string
          minLength: 1
          maxLength: 256
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    DecideCodingReconciliationMutation:
      type: object
      additionalProperties: false
      required:
        - expectedStreamVersion
        - expectedCodingStreamVersion
        - decision
      properties:
        expectedStreamVersion:
          type: integer
          minimum: 1
        expectedCodingStreamVersion:
          type: integer
          minimum: 1
        decision:
          type: string
          enum:
            - terminate
            - mark_completed
            - create_new_call
    CreateProductObjectMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - input
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
        input:
          type: string
          minLength: 1
    CreateCodingTaskMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
        - input
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
        input:
          type: string
          minLength: 1
        repositoryId:
          type: string
          minLength: 1
    RunReadOnlySampleMutation:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedStreamVersion
      properties:
        workspaceId:
          type: string
          minLength: 1
        expectedStreamVersion:
          type: integer
          const: 0
  responses:
    BadRequest:
      description: 请求无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 需要认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 流版本或幂等键冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CursorExpired:
      description: 事件游标已过保留期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: 请求不符合领域约束
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
