name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 22.19.0
  NPM_VERSION: 11.10.1
  IMAGE: ghcr.io/muniu-ai/muniu
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: Verify macOS Desktop release boundary
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify:mac-release
      - run: npm run typecheck:desktop
      - run: npm run build:desktop
      - name: Build ignored mn-host sidecar
        run: npm run build:host-sidecar -- --smoke
      - run: cargo check --locked
        working-directory: apps/desktop-mac/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop-mac/src-tauri

  kubernetes-sandbox:
    name: Verify Kind v2 failover and Pod boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Kind
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "${GOBIN}"
          go install sigs.k8s.io/kind@v0.27.0
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Run enterprise failover and network-isolation probes
        run: scripts/verify-kind-sandbox.sh

  release:
    needs: [desktop, kubernetes-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify:release -- --tag "${RELEASE_TAG}"
      - run: npm run test:release-contract
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/test/deployment-v2.test.mjs
      - run: >-
          node --test
          scripts/test/enterprise-runtime.test.mjs
          scripts/test/postgres-kernel-store.test.mjs
          scripts/test/postgres-worker-store.test.mjs
      - run: docker compose -f docker-compose.enterprise.yml config --quiet
      - run: npm run docs:check
      - run: npm run docs:links
      - run: npm run docs:build
      - run: npm run verify:oss-baseline
      - run: npm run test:oss-policy
      - run: npm run verify:licenses
      - run: npm run verify:enterprise-fixture
      - run: helm version --short
      - run: npm run verify:helm
      - run: npm audit --omit=dev
      - name: Create source, SBOM and license artifacts
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="muniu-${RELEASE_TAG}/" -o "release/muniu-${RELEASE_TAG}.tar.gz" HEAD
          npm sbom --sbom-format spdx --omit=dev > "release/muniu-${RELEASE_TAG}.spdx.json"
          cp THIRD_PARTY_NPM_LICENSES.json "release/muniu-${RELEASE_TAG}.npm-licenses.json"
          cp THIRD_PARTY_CARGO_LICENSES.json "release/muniu-${RELEASE_TAG}.cargo-licenses.json"
          cp THIRD_PARTY_NOTICES.md "release/muniu-${RELEASE_TAG}.third-party-notices.md"
          cp vendor/SOURCE_MANIFEST.sha256 "release/muniu-${RELEASE_TAG}.vendor-sources.sha256"
          sha256sum release/* > release/SHA256SUMS
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push multi-architecture image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${RELEASE_TAG#v}" \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --provenance=mode=max \
            --sbom=true \
            --push .
      - name: Attest release files
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" release/* --verify-tag --generate-notes
