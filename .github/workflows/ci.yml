name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0
  NPM_VERSION: 11.10.1
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  baseline:
    name: Open-source baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan complete Git history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --config .gitleaks.toml
          --redact
          --no-banner
          --log-opts=--all
      - run: npm ci
      - run: npm run verify:oss-baseline
      - run: npm run test:oss-policy
      - run: npm run verify:licenses
      - name: Enforce Cargo license policy with cargo-deny 0.20.2
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: licenses
          manifest-path: apps/desktop-mac/src-tauri/Cargo.toml
      - run: npm audit --omit=dev

  node:
    name: Node build, typecheck, tests, enterprise fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:enterprise-fixture

  desktop:
    name: macOS desktop and Rust
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify:mac-release
      - run: npm run typecheck:desktop
      - run: npm run build:desktop
      - name: Build and smoke-test ignored desktop sidecars
        run: npm run build:daemon-sidecar
      - run: cargo check --locked
        working-directory: apps/desktop-mac/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop-mac/src-tauri
