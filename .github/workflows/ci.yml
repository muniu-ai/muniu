name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0
  NPM_VERSION: 11.10.1
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  baseline:
    name: Open-source baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify:oss-baseline
      - run: npm audit --omit=dev

  node:
    name: Node build, typecheck, tests, enterprise fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:enterprise-fixture

  desktop:
    name: macOS desktop and Rust
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run typecheck:desktop
      - run: npm run build:desktop
      - name: Build and smoke-test ignored desktop sidecars
        run: npm run build:daemon-sidecar
      - run: cargo check --locked
        working-directory: apps/desktop-mac/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop-mac/src-tauri
