name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0
  NPM_VERSION: 11.10.1
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  baseline:
    name: Open-source baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan complete Git history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --config .gitleaks.toml
          --redact
          --no-banner
          --log-opts=--all
      - run: npm ci
      - run: npm run verify:oss-baseline
      - run: npm run test:oss-policy
      - run: npm run test:release-contract
      - run: npm run verify:licenses
      - name: Enforce Cargo license policy with cargo-deny 0.20.2
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: licenses
          manifest-path: apps/desktop-mac/src-tauri/Cargo.toml
      - run: npm audit --omit=dev

  node:
    name: Node build, typecheck, tests, enterprise fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify:release
      - run: npm run build
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run docs:links
      - run: npm run docs:build
      - run: helm version --short
      - run: npm run verify:helm
      - run: npm test
      - run: node --test scripts/test/deployment-v2.test.mjs
      - run: >-
          node --test
          scripts/test/enterprise-runtime.test.mjs
          scripts/test/postgres-kernel-store.test.mjs
          scripts/test/postgres-worker-store.test.mjs
      - run: docker compose -f docker-compose.enterprise.yml config --quiet
      - run: npm run verify:enterprise-fixture

  kubernetes-sandbox:
    name: Kind enterprise failover and Pod boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Install pinned Kind
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "${GOBIN}"
          go install sigs.k8s.io/kind@v0.27.0
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Run enterprise failover and network-isolation probes
        run: scripts/verify-kind-sandbox.sh

  desktop:
    name: macOS desktop and Rust
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Build Runner, Worker, and desktop Host fixture dependencies
        run: npm run build
      - name: Test external Coding Runner chain
        run: |
          npm test -w @mn/runner-claude-cli
          npm test -w @mn/runner-codex-cli
          npm test -w @mn/worker
      - run: npm run verify:mac-release
      - run: npm run typecheck:desktop
      - run: npm run build:desktop
      - name: Verify Agent OS desktop journeys
        run: |
          npm run verify:onboarding-ui
          npm run verify:opc-ui
          npm run verify:coding-ui
      - name: Build ignored mn-host sidecar
        run: npm run build:host-sidecar -- --smoke
      - run: cargo check --locked
        working-directory: apps/desktop-mac/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop-mac/src-tauri
