name: enterprise-e51-verification

on:
  push:
    branches: [codex/enterprise-e5-1-ci]

permissions:
  contents: read

concurrency:
  group: enterprise-e51-verification
  cancel-in-progress: false

env:
  NODE_VERSION: 22.19.0
  NPM_VERSION: 11.10.1
  NODE_OPTIONS: --max-old-space-size=512
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  COMPOSE_PROJECT_NAME: mn-e51-ci-${{ github.run_id }}-${{ github.run_attempt }}
  COMPOSE_PARALLEL_LIMIT: '1'

jobs:
  synthetic-enterprise:
    name: Serial provider and enterprise dependency verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the pinned npm version
        run: npm install --global npm@${NPM_VERSION}
      - name: Keep Node test files serial
        shell: bash
        run: |
          mn_verify_node="$(command -v node)"
          mkdir -p "$RUNNER_TEMP/enterprise-serial/bin"
          cat > "$RUNNER_TEMP/enterprise-serial/bin/node" <<'PY'
          #!/usr/bin/env python3
          import os, sys
          args = sys.argv[1:]
          if '--test' in args:
              filtered = []
              skip = False
              for arg in args:
                  if skip:
                      skip = False
                      continue
                  if arg == '--test-concurrency':
                      skip = True
                  elif not arg.startswith('--test-concurrency='):
                      filtered.append(arg)
              args = filtered
              args.insert(args.index('--test') + 1, '--test-concurrency=1')
          real = "__MN_PINNED_NODE__"
          os.execv(real, [real, *args])
          PY
          python3 - "$RUNNER_TEMP/enterprise-serial/bin/node" "$mn_verify_node" <<'PY'
          import pathlib, sys
          target = pathlib.Path(sys.argv[1])
          target.write_text(target.read_text().replace('"__MN_PINNED_NODE__"', repr(sys.argv[2])))
          PY
          chmod 700 "$RUNNER_TEMP/enterprise-serial/bin/node"
          echo "$RUNNER_TEMP/enterprise-serial/bin" >> "$GITHUB_PATH"
      - name: Record the exact checkout and available resources
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          free -m
          nproc
          docker version
          docker compose version
          helm version --short
      - run: npm ci
      - run: npm run verify:contracts
      - name: Verify PDF process limits before the full suite
        run: |
          npm run build
          node node_modules/typescript/bin/tsc -p apps/host/tsconfig.test.json
          node --test --test-concurrency=1 apps/host/dist-test/test/document-pdf-process-status.test.js apps/host/dist-test/test/document-extraction.test.js
      - name: Verify all Node suites serially
        run: npm test
      - run: npm run typecheck
      - name: Install the pinned Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          browser_root="/opt/muniu-ci-browsers-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          profile_file="/etc/apparmor.d/muniu-ci-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -o "$(id -un)" -g "$(id -gn)" "$browser_root"
          PLAYWRIGHT_BROWSERS_PATH="$browser_root" node node_modules/playwright-core/cli.js install --with-deps chromium
          sudo chown -R root:root "$browser_root"
          sudo chmod -R go-w "$browser_root"
          python3 - "$browser_root" > "$RUNNER_TEMP/muniu-browser.apparmor" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          executables = sorted(path for path in root.rglob('*') if path.is_file() and path.name in ('chrome', 'chrome-headless-shell'))
          assert len(executables) >= 2
          print('abi <abi/4.0>,\ninclude <tunables/global>')
          for index, executable in enumerate(executables):
              target = executable.resolve()
              assert root in target.parents and target.stat().st_uid == 0
              print(f'profile {root.name}-{index} "{target}" flags=(unconfined) {{\n  userns,\n}}')
          PY
          sudo install -m 0644 "$RUNNER_TEMP/muniu-browser.apparmor" "$profile_file"
          echo "MUNIU_CI_APPARMOR_PROFILE=$profile_file" >> "$GITHUB_ENV"
          sudo apparmor_parser -r "$profile_file"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_root" >> "$GITHUB_ENV"
      - name: Verify enterprise Web permissions and business workflows
        run: npm run verify:web-ui
      - name: Prepare the PostgreSQL verification image
        run: docker pull postgres:16-alpine
      - name: Verify payment period history with real PostgreSQL
        run: npm run verify:business-postgres
      - run: npm run verify:provider-contracts
      - run: npm run verify:provider-contracts-postgres
      - name: Verify real PostgreSQL, S3, Vault and two Host/Worker instances
        run: npm run verify:enterprise-fixture
      - name: Collect fixture diagnostics and remove only this Compose project
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.enterprise.yml logs --no-color --tail 100
          docker compose -f docker-compose.enterprise.yml down --volumes --remove-orphans
      - name: Remove only this run's browser profile
        if: always()
        shell: bash
        run: |
          if [ -n "${MUNIU_CI_APPARMOR_PROFILE:-}" ] && [ -f "$MUNIU_CI_APPARMOR_PROFILE" ]; then
            sudo apparmor_parser -R "$MUNIU_CI_APPARMOR_PROFILE"
            sudo rm "$MUNIU_CI_APPARMOR_PROFILE"
          fi
      - name: Confirm generated sources are unchanged
        run: |
          npm run docs:check
          npm run docs:links
          npm run docs:build
          git diff --check
          git diff --exit-code
